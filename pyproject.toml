[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uop-coare"
version = "0.1.0"
description = "Python package for COARE 3.6 bulk air-sea flux calculations (no warm layer computations)."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "numpy"
]
license = { text = "MIT" }
authors = [
  { name = "Unknown" }
]

[project.optional-dependencies]
test = [
  "pytest",
  "xarray",
  "pandas",
  "netCDF4"
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
